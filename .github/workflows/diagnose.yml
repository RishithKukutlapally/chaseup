name: Diagnose and Fix Cloud Run

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    name: Diagnose and Fix Cloud Run Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 460.0.0"

      - name: Run Diagnostics & Ensure Public Access
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          echo "Project: ${PROJECT_ID}"
          gcloud config set project "${PROJECT_ID}" --quiet

          echo "=== 1. LIST CLOUD RUN SERVICES IN ASIA-SOUTH1 ==="
          gcloud run services list --region asia-south1

          echo "=== 2. DESCRIBE NORTHGATE-CHASE ==="
          gcloud run services describe northgate-chase --region asia-south1 || true

          echo "=== 3. DESCRIBE NORTHGATE-CHASEZERO ==="
          gcloud run services describe northgate-chasezero --region asia-south1 || true

          echo "=== 4. CHECK IAM POLICY FOR NORTHGATE-CHASE ==="
          gcloud run services get-iam-policy northgate-chase --region asia-south1 || true

          echo "=== 5. ENFORCE ALLUSERS INVOKER & INGRESS ALL ==="
          gcloud run services add-iam-policy-binding northgate-chase \
            --region asia-south1 \
            --member="allUsers" \
            --role="roles/run.invoker" || true

          gcloud run services update northgate-chase \
            --region asia-south1 \
            --ingress all || true

          echo "=== 6. CURL TESTS ==="
          URL1=$(gcloud run services describe northgate-chase --region asia-south1 --format "value(status.url)" || true)
          echo "Discovered URL for northgate-chase: ${URL1}"
          if [ -n "${URL1}" ]; then
            curl -sv "${URL1}" || true
            curl -sv "${URL1}/docs" || true
          fi

          echo "=== 7. CHECK RECENT LOGS ==="
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=northgate-chase" --limit 20 --format "value(textPayload)" || true
